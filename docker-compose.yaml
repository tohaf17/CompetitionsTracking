services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gymnastics-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Gymnastics_2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: CompetitionsTracking/Dockerfile
    container_name: gymnastics-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=GymnasticsDb;User Id=sa;Password=Gymnastics_2026!;TrustServerCertificate=True;Encrypt=False;Connection Timeout=60;"
      Jwt__Key: "SuperSecretKeyForGymnasticsTrackingApp2026"
      Jwt__Issuer: "CompetitionsTrackingApi"
      Jwt__Audience: "CompetitionsTrackingClient"
      Seeding__ForceReseed: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: CompetitionsTracking.Frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8080/api"
    container_name: gymnastics-frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  sqlserver-data:
